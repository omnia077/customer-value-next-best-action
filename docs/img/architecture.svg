<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- column headers -->
  <g font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">
    <text x="105" y="34">Simulated data</text>
    <text x="305" y="34">Features</text>
    <text x="530" y="34">Models</text>
    <text x="745" y="34">Decision layer</text>
    <text x="915" y="34">Outputs</text>
  </g>

  <!-- data -->
  <g fill="#f6f8fa" stroke="#8c959f">
    <rect x="25" y="50" width="160" height="46" rx="8"/>
    <rect x="25" y="106" width="160" height="46" rx="8"/>
    <rect x="25" y="162" width="160" height="46" rx="8"/>
    <rect x="25" y="218" width="160" height="58" rx="8"/>
  </g>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="105" y="70">customers</text><text x="105" y="86" fill="#57606a" font-size="11">20,000 · 72% prepaid</text>
    <text x="105" y="126">recharge_records</text><text x="105" y="142" fill="#57606a" font-size="11">~206k top-ups</text>
    <text x="105" y="182">usage_events</text><text x="105" y="198" fill="#57606a" font-size="11">~1.3M sessions</text>
    <text x="105" y="238">campaign_history</text><text x="105" y="254" fill="#57606a" font-size="11">2 randomized offers</text><text x="105" y="268" fill="#57606a" font-size="11">(April, June)</text>
  </g>
  <rect x="25" y="330" width="160" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="105" y="352">ground_truth</text>
    <text x="105" y="368" fill="#57606a" font-size="11">true uplift, planted types,</text>
    <text x="105" y="382" fill="#57606a" font-size="11">churn dates · validation only</text>
  </g>

  <!-- features -->
  <rect x="225" y="50" width="160" height="226" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="305" y="132" font-weight="700">Point-in-time</text>
    <text x="305" y="150" font-weight="700">features</text>
    <text x="305" y="176" fill="#57606a" font-size="11">30 / 60 / 180-day windows</text>
    <text x="305" y="192" fill="#57606a" font-size="11">recency · frequency</text>
    <text x="305" y="208" fill="#57606a" font-size="11">size · usage mix</text>
    <text x="305" y="230" fill="#57606a" font-size="11">a test proves no</text>
    <text x="305" y="244" fill="#57606a" font-size="11">future data leaks in</text>
  </g>

  <!-- models -->
  <g fill="#fff8c5" stroke="#d4a72c">
    <rect x="425" y="50" width="210" height="46" rx="8"/>
    <rect x="425" y="106" width="210" height="46" rx="8"/>
    <rect x="425" y="162" width="210" height="46" rx="8"/>
    <rect x="425" y="218" width="210" height="58" rx="8"/>
    <rect x="425" y="286" width="210" height="46" rx="8"/>
  </g>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="530" y="70" font-weight="700">Segmentation</text><text x="530" y="86" fill="#57606a" font-size="11">k-means · 4 personas</text>
    <text x="530" y="126" font-weight="700">CLV</text><text x="530" y="142" fill="#57606a" font-size="11">BG/NBD + Gamma-Gamma</text>
    <text x="530" y="182" font-weight="700">Propensity</text><text x="530" y="198" fill="#57606a" font-size="11">recharge ≥ 500 SDG next month</text>
    <text x="530" y="238" font-weight="700">Uplift</text><text x="530" y="254" fill="#57606a" font-size="11">S / T / X-learner, chosen on</text><text x="530" y="268" fill="#57606a" font-size="11">April cross-validation</text>
    <text x="530" y="306" font-weight="700">Churn risk</text><text x="530" y="322" fill="#57606a" font-size="11">stand-in or Project 1 scores</text>
  </g>

  <!-- decision layer -->
  <rect x="670" y="50" width="150" height="282" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="745" y="82" font-weight="700">One action per</text>
    <text x="745" y="98" font-weight="700">subscriber,</text>
    <text x="745" y="114" font-weight="700">under a budget</text>
    <text x="745" y="150" fill="#57606a" font-size="11">ranked by expected</text>
    <text x="745" y="164" fill="#57606a" font-size="11">net value (SDG)</text>
    <text x="745" y="200" font-weight="700">Grow</text><text x="745" y="214" fill="#57606a" font-size="11">recharge bonus</text>
    <text x="745" y="238" font-weight="700">Protect</text><text x="745" y="252" fill="#57606a" font-size="11">retention offer</text>
    <text x="745" y="276" font-weight="700">Win back</text><text x="745" y="290" fill="#57606a" font-size="11">lapsed lines</text>
    <text x="745" y="314" font-weight="700">Maintain</text>
  </g>

  <!-- outputs -->
  <g fill="#f6f8fa" stroke="#8c959f">
    <rect x="850" y="50" width="130" height="70" rx="8"/>
    <rect x="850" y="130" width="130" height="70" rx="8"/>
    <rect x="850" y="210" width="130" height="122" rx="8"/>
  </g>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="915" y="78" font-weight="700">Persona KPIs</text><text x="915" y="94" fill="#57606a" font-size="11">DuckDB mart</text><text x="915" y="108" fill="#57606a" font-size="11">ARPU · MOU</text>
    <text x="915" y="158" font-weight="700">Dashboard</text><text x="915" y="174" fill="#57606a" font-size="11">deck · briefs</text><text x="915" y="188" fill="#57606a" font-size="11">(EN / AR)</text>
    <text x="915" y="238" font-weight="700">Monitoring</text><text x="915" y="254" fill="#57606a" font-size="11">MLflow</text><text x="915" y="268" fill="#57606a" font-size="11">drift check (PSI)</text><text x="915" y="290" fill="#57606a" font-size="11">10-seed robustness</text><text x="915" y="304" fill="#57606a" font-size="11">study</text>
  </g>

  <!-- arrows -->
  <g stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="187" y1="163" x2="223" y2="163"/>
    <line x1="387" y1="163" x2="423" y2="163"/>
    <line x1="637" y1="191" x2="668" y2="191"/>
    <line x1="822" y1="191" x2="848" y2="191"/>
  </g>
  <!-- validation-only link -->
  <path d="M187 365 H530 V336" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="358" y="358" font-size="11" fill="#57606a" text-anchor="middle">checks results, never a feature</text>

  <!-- orchestration band -->
  <rect x="225" y="392" width="755" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="602" y="409" font-size="11.5" fill="#57606a" text-anchor="middle">score_monthly.py (same steps as the Airflow DAG, not executed) · 17 tests · GitHub Actions CI</text>
</svg>
